name: Build unsigned IPA

# Produces an unsigned .ipa for sideloading with SideStore / AltStore.
#
# Signing is deliberately switched off: SideStore re-signs with your own Apple ID when it
# installs, so anything signed here would just be thrown away. `-target` rather than `-scheme`
# because the project ships no shared .xcscheme — the widget extension is still built, via the
# target dependency on the app.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image (macos-26 ships GA Xcode 26.6; xcode-27-arm64 is a beta preview)"
        required: false
        default: macos-26

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain and require a modern iOS SDK
        # iOS hands an app the current design language only when it is *linked against the
        # iOS 26-or-later SDK*; anything older is rendered in the legacy compatibility
        # appearance. The first run of this workflow used macos-14 / Xcode 15.4 /
        # iPhoneOS17.5.sdk and shipped exactly that, so the SDK is now asserted, not assumed.
        #
        # macos-26 is the GA image: Xcode 26.6, iOS 26.5 SDK. That clears the >= 26 gate, so
        # the app gets the modern appearance on iOS 26 and 27 alike. Xcode 27 exists only as a
        # beta preview image, which is not worth shipping a sideload from — override the
        # `runner` input if you ever want it.
        #
        # IPHONEOS_DEPLOYMENT_TARGET stays at 17.0, so the app still installs on iOS 17.
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK_VERSION"
          MAJOR="${SDK_VERSION%%.*}"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Built against the iOS $SDK_VERSION SDK. iOS renders anything older than 26 in legacy compatibility mode, so the app would not pick up the current design language. Use a runner image with Xcode 26 or newer."
            exit 1
          fi
          xcodebuild -project MedxElite.xcodeproj -list

      - name: Build (unsigned, Release, device)
        # `SYMROOT` rather than `-derivedDataPath`, which xcodebuild only accepts alongside
        # `-scheme` — and this project ships no shared .xcscheme, so the build is driven by
        # `-target`. The widget extension still gets built, via the app's target dependency.
        #
        # `CODE_SIGN_ENTITLEMENTS` is deliberately *not* blanked: the declaration stays in the
        # project so a sideloader that can provision an App Group has something to read. An
        # unsigned build carries no code signature and therefore no embedded entitlements, so
        # whether the App Group survives depends on the installer — the app is built to work
        # either way (`MedxAppGroup.resolvedIdentifier`).
        run: |
          set -o pipefail
          xcodebuild \
            -project MedxElite.xcodeproj \
            -target MedxElite \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build

      - name: Assemble the IPA
        run: |
          # Located rather than hardcoded, so a surprise in the output layout fails loudly
          # instead of silently packaging nothing.
          APP=$(find build -maxdepth 3 -type d -name "MedxElite.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::MedxElite.app was not produced"
            find build -maxdepth 3 -type d -name "*.app" -o -maxdepth 2 -type d | head -20
            exit 1
          fi
          echo "app: $APP"

          # The widget extension must have been embedded, or the installed app has no widgets.
          if [ ! -d "$APP/PlugIns/MedxWidgets.appex" ]; then
            echo "::error::MedxWidgets.appex is missing from PlugIns — check the Embed Foundation Extensions phase"
            ls -la "$APP" || true
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MedxElite-unsigned.ipa Payload
          ls -lh MedxElite-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MedxElite-unsigned-ipa
          path: MedxElite-unsigned.ipa
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MedxElite-unsigned.ipa
